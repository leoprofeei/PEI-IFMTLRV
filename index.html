<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PEI — IFMT Campus Lucas do Rio Verde</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:system-ui,-apple-system,sans-serif;background:#F4F6F4;color:#1a1a1a;min-height:100vh}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#1B6B4540;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.fade{animation:fadeIn 0.25s ease}
.slide{animation:slideIn 0.2s ease}

/* PEI Form styles */
:root{
  --green:#1B6B45;--green2:#155535;--green3:#F0FDF4;--green4:#BBF7D0;
  --amber:#b45309;--amber-lt:#fff8e7;--amber-bd:#e8d6a8;
  --bd:#e0ddd5;--muted:#5a6b52;
}
.pei-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:16px;margin-bottom:12px}
.pei-card-title{font-size:15px;font-weight:700;color:var(--green);margin-bottom:13px}
.pei-grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pei-grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.pei-fld{display:flex;flex-direction:column;gap:4px}
.pei-label{font-size:13px;font-weight:700;color:var(--green)}
.pei-input{width:100%;padding:9px 11px;border:1px solid #BBF7D0;border-radius:7px;font-size:15px;font-family:inherit;background:#fff;transition:border .15s;color:#1a1a1a}
.pei-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(27,107,69,.1)}
.pei-textarea{width:100%;padding:9px 11px;border:1px solid #BBF7D0;border-radius:7px;font-size:15px;font-family:inherit;background:#fff;resize:vertical;line-height:1.55;transition:border .15s;color:#1a1a1a}
.pei-textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(27,107,69,.1)}

/* Transtorno cards */
.t-card{border:2px solid #e0e0e0;border-radius:8px;padding:11px;cursor:pointer;transition:all .15s;background:#fff;min-height:80px}
.t-card:hover{border-color:#BBF7D0}
.t-card.sel{border-color:var(--green);background:var(--green3)}
.t-short{font-size:15px;font-weight:700;margin-bottom:3px;color:#1a1a1a}
.t-name{font-size:12px;color:var(--muted);line-height:1.35;margin-bottom:5px}
.t-cid{display:none}

/* Field blocks */
.field-block{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #e0e0e0}
.field-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.field-num{font-size:11px;font-weight:700;color:var(--green);background:var(--green3);padding:1px 7px;border-radius:4px;margin-right:5px}
.field-lbl{font-size:14px;font-weight:700;color:#1a1a1a}
.field-sub{font-size:13px;color:var(--muted);margin-left:4px}
.field-guide{font-size:14px;color:var(--muted);font-style:italic;line-height:1.5;margin-bottom:7px}
.field-row{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}

/* Suggestions */
.sugg-wrap{border:1px solid #BBF7D0;border-radius:7px;background:#f4f8ee;overflow:hidden}
.sugg-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--green);user-select:none}
.sugg-hdr:hover{background:#eaf1e0}
.sugg-note{padding:0 11px 5px;font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.45}
.sugg-list{padding:0 9px 9px;display:flex;flex-direction:column;gap:5px}
.sugg-btn{background:#fff;border:1px solid #dde8d4;border-radius:5px;padding:7px 9px;font-size:13.5px;color:#1a1a1a;cursor:pointer;text-align:left;line-height:1.45;transition:all .15s;display:flex;gap:6px;align-items:flex-start;width:100%}
.sugg-btn:hover{background:#fffbf0;border-color:var(--amber)}
.sugg-plus{color:var(--green);font-weight:900;font-size:15px;flex-shrink:0;line-height:1.3}
.sugg-btn:hover .sugg-plus{color:var(--amber)}

/* Bimestre */
.bim-row{display:flex;gap:8px;flex-wrap:wrap}
.bim-btn{padding:9px 18px;border:2px solid #e0e0e0;border-radius:7px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--muted);min-height:42px}
.bim-btn.sel{border-color:var(--green);background:var(--green3);color:var(--green)}

/* Checkboxes */
.ck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px;margin-top:7px}
.ck-btn{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid #e0e0e0;border-radius:7px;background:#fff;cursor:pointer;font-size:14px;color:var(--muted);transition:all .15s;text-align:left;min-height:42px;width:100%}
.ck-btn:hover{border-color:#BBF7D0}
.ck-btn.on{border-color:var(--green);background:var(--green3);color:var(--green);font-weight:600}
.ck-box{width:18px;height:18px;border:2px solid #bbb;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ck-btn.on .ck-box{background:var(--green);border-color:var(--green)}
.ck-tick{color:#fff;font-size:11px;font-weight:900}
.sect-lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--green);margin:12px 0 4px}

/* Action row */
.act-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid #e0e0e0}
.dl-btn{display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--green);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;min-height:46px}
.dl-btn:hover{background:var(--green2)}

/* Warn */
.pei-warn{background:#fff8e7;border:1px solid #e8d6a8;border-radius:7px;padding:9px 12px;font-size:14px;color:#7c5a14;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.t-badge{background:#fff8e7;border:1px solid #e8d6a8;border-radius:7px;padding:7px 11px;font-size:14px;color:#7c5a14;margin-bottom:12px}

/* Alert boxes */
.alert{padding:13px 16px;border-radius:9px;margin-bottom:14px;font-size:16px;line-height:1.7}
.alert-warning{background:#FFF8E1;border-left:4px solid #F59E0B;color:#92400E}
.alert-info{background:#EBF5FB;border-left:4px solid #2196F3;color:#1565C0}
.alert-danger{background:#FEF2F2;border-left:4px solid #EF4444;color:#991B1B}
.alert-success{background:#F0FDF4;border-left:4px solid #22C55E;color:#166534}
.alert-ethics{background:#F5F3FF;border-left:4px solid #8B5CF6;color:#5B21B6}

@media(max-width:600px){
  .pei-grid2,.pei-grid4{grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
}

/* Doc Preview Modal */
.doc-overlay{position:fixed;inset:0;background:rgba(13,27,26,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .2s ease}
.doc-modal{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.doc-modal-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;background:linear-gradient(135deg,#0D2B1A,#1B6B45);color:#fff;flex-wrap:wrap}
.doc-modal-title{font-size:15px;font-weight:700}
.doc-modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.doc-act-btn{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.doc-act-btn:hover{background:rgba(255,255,255,.25)}
.doc-act-btn.copied{background:#22C55E;border-color:#22C55E}
.doc-close-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;flex-shrink:0}
.doc-close-btn:hover{background:rgba(255,255,255,.3)}
.doc-modal-body{flex:1;overflow:auto;padding:20px;background:#f4f6f4}
.doc-modal-body table{border-collapse:collapse;width:100%;background:#fff;font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000}
.doc-modal-body td{border:1px solid #000;padding:5pt 7pt;vertical-align:top}
@media print{
  body *{visibility:hidden}
  .doc-modal-body,.doc-modal-body *{visibility:visible}
  .doc-modal-body{position:absolute;left:0;top:0;width:100%;padding:0}
  .doc-overlay,.doc-modal{position:static;background:none;box-shadow:none;max-height:none;padding:0}
  .doc-modal-hdr{display:none}
}
</style>
</head>

// ── Doc Modal (Visualizar / Imprimir / Baixar / Copiar) ──
const DocModal=({title,bodyHtml,fname,onClose})=>{
  const [copied,setCopied]=useState(false);
  const bodyRef=useRef(null);

  const handlePrint=()=>{
    window.print();
  };

  const handleDownload=()=>{
    const html=`<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8"><title>${title}</title><style>@page{size:A4;margin:2.5cm 2cm 2cm 2cm}body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#000}table{border-collapse:collapse;width:100%}td{border:1px solid #000;padding:5pt 7pt;vertical-align:top;font-size:11pt}</style></head><body>${bodyHtml}</body></html>`;
    dlDoc(fname,html);
  };

  const handleCopy=async()=>{
    try{
      if(bodyRef.current&&navigator.clipboard&&navigator.clipboard.write){
        const htmlBlob=new Blob([bodyRef.current.innerHTML],{type:"text/html"});
        const textBlob=new Blob([bodyRef.current.innerText],{type:"text/plain"});
        const item=new ClipboardItem({"text/html":htmlBlob,"text/plain":textBlob});
        await navigator.clipboard.write([item]);
      }else if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(bodyRef.current?bodyRef.current.innerText:"");
      }else{
        const range=document.createRange();
        range.selectNode(bodyRef.current);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand("copy");
        window.getSelection().removeAllRanges();
      }
      setCopied(true);
      setTimeout(()=>setCopied(false),2200);
    }catch(e){
      try{
        const range=document.createRange();
        range.selectNode(bodyRef.current);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand("copy");
        window.getSelection().removeAllRanges();
        setCopied(true);
        setTimeout(()=>setCopied(false),2200);
      }catch(e2){
        alert("Não foi possível copiar automaticamente. Selecione o texto manualmente e copie (Ctrl+C).");
      }
    }
  };

  return(
    <div className="doc-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="doc-modal">
        <div className="doc-modal-hdr">
          <span className="doc-modal-title">👁 {title}</span>
          <div className="doc-modal-actions">
            <button className="doc-act-btn" onClick={handlePrint}><IcoPrint/> Imprimir</button>
            <button className="doc-act-btn" onClick={handleDownload}><IcoDownload/> Baixar (.doc)</button>
            <button className={`doc-act-btn${copied?" copied":""}`} onClick={handleCopy}>{copied?<IcoCheck/>:<IcoCopy/>} {copied?"Copiado!":"Copiar"}</button>
            <button className="doc-close-btn" onClick={onClose}><IcoX/></button>
          </div>
        </div>
        <div className="doc-modal-body">
          <div ref={bodyRef} dangerouslySetInnerHTML={{__html:bodyHtml}}/>
        </div>
      </div>
    </div>
  );
};

const SHARED={};

// ── Persistência: lista de PEIs salvos no localStorage ──
const STORAGE_KEY="pei_ifmt_lrv_saved_v1";

function loadSavedPEIs(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw?JSON.parse(raw):[];
  }catch(e){
    return [];
  }
}

function persistSavedPEIs(list){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(list));
    return true;
  }catch(e){
    return false;
  }
}

function makePEIRecordId(ident){
  return (ident.nome||"sem-nome").trim().toLowerCase()+"__"+(ident.comp||"sem-componente").trim().toLowerCase();
}

function savePEIRecord({ident,fields,trans}){
  const list=loadSavedPEIs();
  const id=makePEIRecordId(ident);
  const now=new Date().toISOString();
  const idx=list.findIndex(r=>r.id===id);
  const record={id,ident,fields,trans,savedAt:now};
  if(idx>=0){list[idx]=record;}else{list.push(record);}
  persistSavedPEIs(list);
  return list;
}

function deletePEIRecord(id){
  const list=loadSavedPEIs().filter(r=>r.id!==id);
  persistSavedPEIs(list);
  return list;
}

function exportAllPEIs(){
  const list=loadSavedPEIs();
  const json=JSON.stringify(list,null,2);
  const blob=new Blob([json],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  const stamp=new Date().toISOString().slice(0,10);
  a.download=`PEIs_IFMT_LRV_backup_${stamp}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function importAllPEIs(file,onDone){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const incoming=JSON.parse(e.target.result);
      if(!Array.isArray(incoming))throw new Error("formato inválido");
      const current=loadSavedPEIs();
      const byId={};
      current.forEach(r=>{byId[r.id]=r;});
      incoming.forEach(r=>{if(r&&r.id)byId[r.id]=r;});
      const merged=Object.values(byId);
      persistSavedPEIs(merged);
      onDone(true,merged.length);
    }catch(err){
      onDone(false,0);
    }
  };
  reader.readAsText(file);
}

// ── Download helper ──
function dlDoc(fname,html){
  try{
    const blob=new Blob(["\ufeff"+html],{type:"application/msword;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=fname+".doc";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){
    const w=window.open("","_blank");
    if(w){w.document.write(html);w.document.close();}
  }
}

      <p style={{fontSize:16,lineHeight:1.75,color:"#333",marginBottom:16}}>Entenda como funciona o salvamento de PEIs neste guia, e como evitar perder seus dados.</p>

      <Alert type="info"><strong>Você tem {count} PEI(s) salvo(s)</strong> neste navegador agora. Veja abaixo onde eles ficam guardados e como protegê-los.</Alert>

      <Acc title="📁 Como funciona a lista de PEIs salvos" open0 color={G}>
        <p style={{fontSize:14,lineHeight:1.7,color:"#444",marginBottom:10}}>Na aba <strong>Elaborando o PEI</strong>, há um card chamado <strong>Meus PEIs Salvos</strong>. Ao preencher os dados de um estudante e clicar em <strong>💾 Salvar PEI</strong>, esse plano entra numa lista guardada no seu navegador.</p>
        <p style={{fontSize:14,lineHeight:1.7,color:"#444",marginBottom:10}}>Cada PEI é identificado pela combinação de <strong>nome do estudante + componente curricular</strong>. Se você salvar novamente um PEI já existente (mesmo nome e mesmo componente), ele é <strong>atualizado</strong> — não duplicado.</p>
        <p style={{fontSize:14,lineHeight:1.7,color:"#444"}}>Para retomar um PEI depois — seja para revisar, seja para preencher o relatório bimestral seguinte — basta clicar em <strong>Abrir</strong> na lista, e todos os campos voltam exatamente como estavam.</p>
      </Acc>

      <Acc title="⚠️ A limitação importante: onde os dados realmente ficam" color="#B45309">
        <p style={{fontSize:14,lineHeight:1.7,color:"#444",marginBottom:10}}>Os PEIs salvos ficam gravados <strong>no navegador deste computador específico</strong> (tecnicamente, no chamado <em>localStorage</em>). Isso tem consequências importantes:</p>
        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:10}}>
          <div style={{display:"flex",gap:7,fontSize:13.5,color:"#555"}}><span style={{color:"#B45309",fontWeight:700,flexShrink:0}}>•</span>Se você limpar o histórico/dados de navegação do navegador, <strong>os PEIs salvos são perdidos</strong>.</div>
          <div style={{display:"flex",gap:7,fontSize:13.5,color:"#555"}}><span style={{color:"#B45309",fontWeight:700,flexShrink:0}}>•</span>Se abrir este mesmo arquivo em <strong>outro computador, outro navegador, ou no celular</strong>, a lista aparece vazia — os dados não acompanham o arquivo, ficam no navegador onde foram salvos.</div>
          <div style={{display:"flex",gap:7,fontSize:13.5,color:"#555"}}><span style={{color:"#B45309",fontWeight:700,flexShrink:0}}>•</span>Não é compartilhável automaticamente entre diferentes professores ou dispositivos.</div>
        </div>
        <p style={{fontSize:14,lineHeight:1.7,color:"#444"}}>Por isso, recomendamos fortemente usar a exportação de backup descrita abaixo.</p>
      </Acc>

      <Acc title="⬇⬆ Como fazer backup (exportar e importar)" color="#1565C0">
        <p style={{fontSize:14,lineHeight:1.7,color:"#444",marginBottom:10}}>Na aba <strong>Elaborando o PEI</strong>, no card "Meus PEIs Salvos", há dois botões:</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:10,marginBottom:10}}>
          <div style={{padding:13,borderRadius:9,background:"#F0FDF4",border:"1px solid #BBF7D0"}}>
            <h5 style={{margin:"0 0 4px",fontSize:13.5,color:"#0D2B1A",fontWeight:700}}>⬇ Exportar todos (backup)</h5>
            <p style={{margin:0,fontSize:12.5,lineHeight:1.6,color:"#555"}}>Gera um arquivo <code>.json</code> com todos os PEIs salvos até agora. Guarde esse arquivo numa pasta segura — Google Drive, pen drive, e-mail para você mesmo.</p>
          </div>
          <div style={{padding:13,borderRadius:9,background:"#E3F2FD",border:"1px solid #90CAF9"}}>
            <h5 style={{margin:"0 0 4px",fontSize:13.5,color:"#0D47A1",fontWeight:700}}>⬆ Importar backup</h5>
            <p style={{margin:0,fontSize:12.5,lineHeight:1.6,color:"#555"}}>Escolhe um arquivo <code>.json</code> exportado anteriormente e devolve aqueles PEIs à lista — útil ao trocar de computador ou recuperar dados após limpar o navegador.</p>
          </div>
        </div>
        <p style={{fontSize:14,lineHeight:1.7,color:"#444"}}>A importação faz a <strong>combinação</strong> dos PEIs do arquivo com os que já existem no navegador — nenhum dado é apagado nesse processo.</p>
      </Acc>

      <Acc title="✅ Recomendação prática" color="#166534">
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          <div style={{display:"flex",gap:7,fontSize:14,color:"#444"}}><span style={{color:"#166534",fontWeight:700,flexShrink:0}}>1.</span>Sempre que terminar de preencher ou atualizar um PEI, clique em <strong>💾 Salvar PEI</strong>.</div>
          <div style={{display:"flex",gap:7,fontSize:14,color:"#444"}}><span style={{color:"#166534",fontWeight:700,flexShrink:0}}>2.</span>Periodicamente — por exemplo, ao final de cada bimestre — clique em <strong>⬇ Exportar todos</strong> e guarde o arquivo numa pasta segura, fora do navegador.</div>
          <div style={{display:"flex",gap:7,fontSize:14,color:"#444"}}><span style={{color:"#166534",fontWeight:700,flexShrink:0}}>3.</span>Se for usar outro computador, leve esse arquivo de backup e use <strong>⬆ Importar backup</strong> assim que abrir o guia lá.</div>
        </div>
      </Acc>
    </div>
  );
};

const PgSintese=()=>(
  <div>
    <h2 style={{fontSize:28,fontWeight:700,color:"#0D2B1A",marginBottom:12}}>Síntese Prática</h2>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))",gap:13,marginBottom:20}}>
      {[{t:"👀 O que Observar",c:"#0D3B6E",bg:"#EFF6FF",b:"#BFDBFE",i:["Mudanças no comportamento ou rendimento","Dificuldade persistente que destoa do padrão","Sinais de sobrecarga sensorial ou emocional","Discrepância entre capacidade oral e escrita","Desempenho flutuante sem causa aparente"]},{t:"📋 Como Planejar",c:G,bg:"#F0FDF4",b:"#BBF7D0",i:["Consulte o Relatório de Acolhimento antes de elaborar","Defina objetivos específicos a partir do currículo","Diversifique métodos e recursos didáticos","Preveja múltiplas formas de avaliação","Converse com a Coordenação de Assistência Estudantil e Inclusão e a equipe pedagógica"]},{t:"📝 Como Registrar",c:"#5B21B6",bg:"#F5F3FF",b:"#DDD6FE",i:["Preencha o PEI (Anexo II) para seu componente","Elabore o Relatório Bimestral (Anexo III)","Descreva fatos observáveis, não julgamentos","Registre adaptações implementadas e resultados","Entregue documentação para arquivamento"]},{t:"🤝 Quem Acompanha",c:"#B45309",bg:"#FFFBEB",b:"#FDE68A",i:["Docente: elabora e executa o PEI","Coordenação de Curso: orienta e acompanha","Diretoria de Ensino: supervisiona","Coordenação de Assistência Estudantil e Inclusão: acolhe, encaminha e dá suporte","Estudante: protagonista do processo"]}].map((q,i)=>(
        <div key={i} style={{padding:16,borderRadius:12,background:q.bg,border:`1.5px solid ${q.b}`}}>
          <h4 style={{margin:"0 0 10px",fontSize:14,color:q.c,fontWeight:700}}>{q.t}</h4>
          {q.i.map((x,ii)=><div key={ii} style={{display:"flex",gap:6,marginBottom:5,fontSize:13,lineHeight:1.5,color:"#333"}}><span style={{color:q.c,fontWeight:700}}>›</span>{x}</div>)}
        </div>
      ))}
    </div>
    <div style={{padding:20,borderRadius:14,background:`linear-gradient(135deg,${G}10,${G}05)`,border:`1.5px solid ${G}40`,textAlign:"center"}}>
      <p style={{margin:0,fontSize:14,lineHeight:1.8,color:"#0D2B1A",fontStyle:"italic"}}>"Incluir não é apenas garantir a matrícula. É garantir que cada estudante tenha condições reais de aprender, participar e se desenvolver plenamente."</p>
      <p style={{margin:"8px 0 0",fontSize:11,color:"#666"}}>IN Conjunta 2/2023 (RTR-DSAE/RTR/IFMT) · IFMT Campus Lucas do Rio Verde · Diretoria de Ensino · Educação Especial Inclusiva</p>
    </div>
  </div>
);

// ── Mapa de páginas ──
const PAGES={
  visao:<PgVisao/>,
  legislacao:<PgLegislacao/>,
  fluxo:<PgFluxo/>,
  necessidades:<PgNecessidades/>,
  estrategias:<PgEstrategias/>,
  alertas:<PgAlertas/>,
  recursos:<PgRecursos/>,
  sintese:<PgSintese/>,
  salvar:<PgSalvar/>,
};

// ── App Principal ──
function App(){
  const [tab,sTab]=useState("visao");
  const [drawer,sDrawer]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{if(ref.current)ref.current.scrollTop=0;},[tab]);
  useEffect(()=>{SHARED.navigateTo=(id)=>sTab(id);},[]);

  const renderPage=()=>{
    if(tab==="elaboracao")return <PgElaboracao/>;
    if(tab==="registros")return <PgRegistros/>;
    return PAGES[tab]||<PgVisao/>;
  };

  return(
    <div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:"#F4F6F4",minHeight:"100vh",display:"flex",flexDirection:"column"}}>

      {/* Barra azul */}
      <div style={{background:"#0D1B2A",padding:"0 31px",display:"flex",alignItems:"center",justifyContent:"space-between",height:118,position:"sticky",top:0,zIndex:200,boxShadow:"0 2px 8px rgba(0,0,0,0.3)"}}>
        <div style={{display:"flex",alignItems:"center",gap:26}}>
          <button onClick={()=>sDrawer(true)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,background:"none",border:"none",cursor:"pointer",color:"white",padding:"13px 18px",borderRadius:6}}>
            <IcoMenu/>
            <span style={{fontSize:22,fontWeight:700,letterSpacing:3}}>MENU</span>
          </button>
          <div style={{width:1,height:65,background:"rgba(255,255,255,0.2)"}}/>
          <Logo h={80}/>
        </div>
        <span style={{color:"rgba(255,255,255,0.85)",fontSize:22,fontWeight:500}}>
          Instituto Federal de Mato Grosso · Campus Lucas do Rio Verde · Diretoria de Ensino · Educação Especial Inclusiva
        </span>
      </div>

      {/* Drawer */}
      {drawer&&(
        <div style={{position:"fixed",inset:0,zIndex:300,display:"flex"}}>
          <div className="slide" style={{width:320,background:"#0D1B2A",padding:"16px 12px",display:"flex",flexDirection:"column",gap:6,overflowY:"auto"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,padding:"0 4px"}}>
              <Logo h={44}/>
              <button onClick={()=>sDrawer(false)} style={{background:"rgba(255,255,255,0.1)",border:"none",cursor:"pointer",color:"white",borderRadius:7,padding:"6px 8px",display:"flex",alignItems:"center"}}><IcoX/></button>
            </div>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>{sTab(t.id);sDrawer(false);}}
                style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",padding:"11px 14px",border:"none",borderRadius:8,background:tab===t.id?G:"rgba(255,255,255,0.05)",cursor:"pointer",fontSize:14,color:"white",fontWeight:tab===t.id?700:400,textAlign:"left",transition:"all 0.15s"}}>
                {t.label}
                <div style={{width:22,height:22,borderRadius:"50%",border:"2px solid rgba(255,255,255,0.5)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><IcoPlus/></div>
              </button>
            ))}
          </div>
          <div onClick={()=>sDrawer(false)} style={{flex:1,background:"rgba(0,0,0,0.5)",cursor:"pointer"}}/>
        </div>
      )}

      {/* Título */}
      <div style={{background:"linear-gradient(135deg,#0D2B1A,#1B6B45)",padding:"18px 24px",color:"white"}}>
        <h1 style={{margin:0,display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:"clamp(20px,3vw,26px)",fontWeight:800,letterSpacing:-0.3}}>Plano Educacional Individualizado</span>
          <span style={{fontSize:"clamp(14px,2vw,18px)",fontWeight:400,opacity:0.8}}>· Guia completo para educadores · IN Conjunta 2/2023</span>
        </h1>
      </div>

      {/* Conteúdo */}
      <main ref={ref} style={{flex:1,padding:"22px 24px 48px",maxWidth:980,width:"100%",margin:"0 auto"}}>
        <div className="fade" key={tab}>{renderPage()}</div>
      </main>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
